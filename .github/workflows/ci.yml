name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ---- Сборка и тестирование под Linux (GCC) ----
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libsdl2-dev libsdl2-ttf-dev \
            clang llvm

      - name: Загрузка minilua.h
        run: |
          mkdir -p third_party
          if [ ! -f third_party/minilua.h ]; then
            curl -L -o third_party/minilua.h \
              https://raw.githubusercontent.com/edubart/minilua/main/minilua.h
          fi

      - name: Конфигурация
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSNAKE_BUILD_TESTS=ON

      - name: Сборка
        run: cmake --build build -j$(nproc)

      - name: Тесты
        run: cd build && ctest --output-on-failure

  # ---- Сборка с санитайзерами (Clang + ASan/UBSan) ----
  linux-asan:
    name: Linux (Clang + ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake \
            libsdl2-dev libsdl2-ttf-dev

      - name: Загрузка minilua.h
        run: |
          mkdir -p third_party
          curl -L -o third_party/minilua.h \
            https://raw.githubusercontent.com/edubart/minilua/main/minilua.h

      - name: Конфигурация
        env:
          CC: clang
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
                -DSNAKE_BUILD_TESTS=ON -DSNAKE_ENABLE_ASAN=ON

      - name: Сборка
        run: cmake --build build -j$(nproc)

      - name: Тесты
        run: cd build && ctest --output-on-failure

  # ---- Сборка под Windows (MSYS2 + MinGW64) ----
  windows:
    name: Windows (MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkg-config

      - name: Диагностика окружения SDL2
        shell: msys2 {0}
        run: |
          which sdl2-config || true
          sdl2-config --cflags || true
          sdl2-config --libs   || true
          ls -la /mingw64/include/SDL2/SDL.h
          ls -la /mingw64/lib/libSDL2*

      - name: Загрузка minilua.h
        shell: msys2 {0}
        run: |
          mkdir -p third_party
          curl -L -o third_party/minilua.h \
            https://raw.githubusercontent.com/edubart/minilua/main/minilua.h

      - name: Конфигурация
        shell: msys2 {0}
        run: |
          cmake -S . -B build \
                -G "MinGW Makefiles" \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_MAKE_PROGRAM=mingw32-make \
                -DCMAKE_PREFIX_PATH=/mingw64 \
                -DSNAKE_BUILD_TESTS=ON

      - name: Сборка
        shell: msys2 {0}
        run: cmake --build build -j

      - name: Тесты
        shell: msys2 {0}
        run: cd build && ctest --output-on-failure