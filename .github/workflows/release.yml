# ============================================================
# release.yml — автоматическая публикация релизов на GitHub.
#
# Срабатывает двумя способами:
#   1) автоматически при пуше тега вида v* (например, v1.0.0);
#   2) вручную через вкладку Actions → Release → Run workflow.
#
# Собирает snake под Linux (Ubuntu) и Windows (MSYS2/MinGW),
# затем создаёт GitHub Release и прикрепляет к нему бинарники.
#
# Публикация выполняется через gh CLI — он надёжнее принимает
# пути к файлам, чем softprops/action-gh-release.
# ============================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Существующий тег, для которого создаётся релиз (например, v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------
  # Сборка под Linux (Ubuntu)
  # ----------------------------------------------------------
  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libsdl2-dev libsdl2-ttf-dev \
            curl

      - name: Загрузка minilua.h
        run: |
          mkdir -p third_party
          curl -L -o third_party/minilua.h \
            https://raw.githubusercontent.com/edubart/minilua/main/minilua.h

      - name: Конфигурация и сборка
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNAKE_BUILD_TESTS=OFF
          cmake --build build -j$(nproc)

      - name: Подготовка артефакта
        run: |
          mkdir -p dist
          cp build/snake dist/snake-linux-x86_64
          cp -r scripts dist/scripts

      - name: Упаковка в tar.gz
        run: |
          cd dist
          tar czf snake-linux-x86_64.tar.gz \
              snake-linux-x86_64 scripts

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: snake-linux
          path: dist/snake-linux-x86_64.tar.gz
          if-no-files-found: error

  # ----------------------------------------------------------
  # Сборка под Windows (MSYS2 + MinGW64)
  # ----------------------------------------------------------
  build-windows:
    name: Build Windows binary
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkg-config
            zip

      - name: Диагностика окружения
        shell: msys2 {0}
        run: |
          which cmake
          which mingw32-make
          which gcc
          which zip

      - name: Загрузка minilua.h
        shell: msys2 {0}
        run: |
          mkdir -p third_party
          curl -L -o third_party/minilua.h \
            https://raw.githubusercontent.com/edubart/minilua/main/minilua.h

      - name: Конфигурация
        shell: msys2 {0}
        run: |
          cmake -S . -B build \
                -G "MinGW Makefiles" \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_MAKE_PROGRAM=mingw32-make \
                -DCMAKE_PREFIX_PATH=/mingw64 \
                -DSNAKE_BUILD_TESTS=OFF

      - name: Сборка
        shell: msys2 {0}
        run: cmake --build build -j

      - name: Подготовка артефакта
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/snake.exe dist/snake-windows-x86_64.exe
          cp -r scripts dist/scripts
          cp /mingw64/bin/SDL2.dll dist/ || \
            cp /mingw64/bin/libSDL2-2.0-0.dll dist/SDL2.dll || true

      - name: Упаковка в ZIP
        shell: msys2 {0}
        run: |
          cd dist
          zip -r snake-windows-x86_64.zip \
              snake-windows-x86_64.exe SDL2.dll scripts

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: snake-windows
          path: dist/snake-windows-x86_64.zip
          if-no-files-found: error

  # ----------------------------------------------------------
  # Создание релиза и прикрепление бинарников
  # ----------------------------------------------------------
  release:
    name: Publish release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Определение целевого тега
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Целевой тег: $TAG"

      - name: Проверка существования тега
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          if ! git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Ошибка: тег $TAG не существует в репозитории"
            echo "Создайте его командой: git tag -a $TAG -m '...' && git push origin $TAG"
            exit 1
          fi
          echo "OK: тег $TAG найден"

      - name: Скачивание артефактов
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Показать содержимое dist/
        run: |
          echo "=== Дерево dist/ ==="
          ls -laR dist/
          echo ""
          echo "=== Проверка обоих файлов ==="
          test -f dist/snake-linux-x86_64.tar.gz && echo "OK: linux archive"
          test -f dist/snake-windows-x86_64.zip  && echo "OK: windows archive"

      - name: Публикация релиза через gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.target.outputs.tag }}"

          # Если релиз по тегу уже существует — удаляем,
          # чтобы избежать переиспользования пустого релиза.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Удаляем существующий релиз $TAG"
            gh release delete "$TAG" --yes --cleanup-tag=false
          fi

          echo "Создаём релиз $TAG и прикрепляем ассеты..."
          gh release create "$TAG" \
            --title "Snake $TAG" \
            --notes "Кроссплатформенная ретро-игра «Змейка».
          Ядро на C, игровая логика на Lua, графика SDL2.

          ### Управление

          | Клавиша | Действие |
          |---------|----------|
          | R | Начать игру / перезапустить после Game Over |
          | Стрелки | Движение |
          | W A S D | Альтернативное управление |
          | Пробел | Пауза |
          | Esc | Выход |

          ### Как запустить

          **Linux:**
          \`\`\`bash
          tar xzf snake-linux-x86_64.tar.gz
          ./snake-linux-x86_64
          \`\`\`
          Требуется SDL2: \`sudo apt install libsdl2-2.0-0\`.

          **Windows:**
          Распакуйте \`snake-windows-x86_64.zip\` и запустите
          \`snake-windows-x86_64.exe\`. \`SDL2.dll\` лежит рядом." \
            dist/snake-linux-x86_64.tar.gz \
            dist/snake-windows-x86_64.zip

      - name: Проверка вложений
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          echo "=== Ассеты в релизе $TAG ==="
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "  \(.name) — \(.size) bytes"'